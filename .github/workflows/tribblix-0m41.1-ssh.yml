name: tribblix-0m41.1-ssh

# THE SSH STAGE: boot the installed disk, prove sshd and the desktop over the network, and publish.
#
# IT CONTINUES `tribblix-install`, WHICH IS THE TAG THIS REPOSITORY'S INSTALL LEG PUBLISHES - not a
# shorter `tribblix`, which no leg here writes and which a pull would answer with "is not in the
# package".
#
# IT PUBLISHES A DISK, AND THE NEXT STAGE PULLS IT BY THE NAME THIS ONE GIVES: `tribblix-ssh`.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default tribblix-install)
        default: "tribblix-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-solaris"

concurrency:
  group: tribblix-0m41.1-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      # THE GUEST'S PASSWORD IS `tribblix`, AND IT HAS TO BE NAMED HERE OR THE PROBE USES `admin`.
      #
      # MEASURED, and this is what five runs of this stage failed on: `easyvm run` declares
      # `--password` with a default of `admin` and ALWAYS sends it, so a walk that says
      # `password tribblix` is overridden by the flag before the daemon ever reads the file. The
      # daemon then probes sshd as `admin`, sshd answers
      #
      #	tribblix sshd-session[...]: error: PAM: Authentication failed for root from 172.30.0.1
      #
      # once a minute while the console of the same machine answered `root`/`tribblix` and
      # `ssh root@127.0.0.1 echo HELLO` from inside the guest printed `HELLO`.
      #
      # `stage.yml` documents the same trap for opensuse-leap-16.1 and passes the caller's value
      # through only when one is given - so this is the one place to give it.
      password: tribblix
      # THE DESKTOP IS ALREADY ON THE DISK - the install leg ran `desktop` - so this leg adds no
      # packages, and the budget covers the pulled disk, the session coming up and the compressed
      # result. `disk_gb` is a budget, not the disk's virtual size.
      disk_gb: "40"
      group: tribblix-0m41.1-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "tribblix-ssh",
            "file": "tribblix/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "tribblix-ssh.qcow2",
            "publish": "tribblix-ssh",
            "timeout": 90
          }
        ]
