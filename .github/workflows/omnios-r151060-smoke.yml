name: omnios-r151060-smoke

# DOES THE PUBLISHED DISK START? Boot it, record three minutes, kill it.
#
# THIS IS THE CLAIM THE INSTALL LEG CANNOT MAKE. A walkthrough can answer every one of its steps and
# still publish a disk no firmware will boot - MEASURED on this very guest: a run stopped while the
# page read `Installing ZFS image  100%` published a disk whose loader answered
#
#	No rootfs module provided, aborting
#	ok
#
# because the installer still had a boot archive to rebuild. The install walk now waits for it, and
# this file is what proves the disk it produced gets off the ground.
#
# IT PUBLISHES NO DISK. `out:` is empty, so stage.yml reports "no disk to publish (the stage may not
# write one)" and the only artifact is the recording. The disk it verifies is the one the install leg
# already published, so this is safe to run at any time.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk to boot. Empty uses the tag this repository's install leg publishes.
        default: "omnios-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-solaris"

concurrency:
  group: omnios-r151060-smoke
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  smoke:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "25"
      group: omnios-r151060-smoke
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "omnios-smoke",
            "file": "omnios/steps/smoke.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "",
            "timeout": 20
          }
        ]
