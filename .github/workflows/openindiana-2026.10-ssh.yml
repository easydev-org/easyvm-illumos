name: openindiana-2026.10-ssh

# THE SSH STAGE: boot the installed disk, add a desktop, and prove both over the network.
#
# IT CONTINUES `openindiana-install`, WHICH IS THE TAG THIS REPOSITORY'S INSTALL LEG PUBLISHES - not
# a shorter `openindiana`, which no leg here writes and which a pull would answer with "is not in the
# package".
#
# IT PUBLISHES A DISK, AND THE NEXT STAGE PULLS IT BY THE NAME THIS ONE GIVES: `openindiana-ssh`.

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default openindiana-install)
        default: "openindiana-install"
      disks_repository:
        description: "the ghcr repository that holds the disk"
        default: "easydev-org/easyvm-solaris"

concurrency:
  group: openindiana-2026.10-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      # THE INSTALLED SYSTEM IS 1049 MiB AND THE DESKTOP IS WHAT THIS LEG ADDS, so the budget covers
      # the pulled disk, the packages `pkg` downloads and the compressed result. It is not the disk's
      # virtual size - `disk_gb` never is.
      disk_gb: "40"
      group: openindiana-2026.10-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "openindiana-ssh",
            "file": "openindiana/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "openindiana-ssh.qcow2",
            "publish": "openindiana-ssh",
            "timeout": 150
          }
        ]
